<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuku Creatives | D2C Creative Studio & Shopify Growth</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">


  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --secondary: #0D9488;
      --accent-soft: #EEF2FF;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 12px 30px -6px rgba(79, 70, 229, 0.12), 0 8px 16px -4px rgba(15, 23, 42, 0.04);
      --shadow-hover: 0 20px 35px -8px rgba(79, 70, 229, 0.2);
      --whatsapp: #25D366;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #EEF2FF 0%, #F8FAFC 45%);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px 40px;
      overflow-x: hidden;
    }


    .app-container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
    }


    /* Keyframes Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    @keyframes pulseDot {
      0% { transform: scale(0.9); opacity: 0.8; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      70% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.9); opacity: 0.8; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }


    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }


    /* Animated Entry Classes */
    .animate-entry {
      animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }


    /* Header Profile Card */
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 38px 24px 30px;
      text-align: center;
      box-shadow: var(--shadow-md);
      position: relative;
      margin-bottom: 24px;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }


    .hero-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 50%, #EC4899 100%);
    }


    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      color: #065F46;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }


    .badge-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: #10B981;
      display: inline-block;
      animation: pulseDot 2s infinite ease-in-out;
    }


    .brand-title {
      font-size: 2.35rem;
      font-weight: 800;
      letter-spacing: -0.6px;
      color: var(--text-main);
      margin-bottom: 10px;
    }


    .brand-title span {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }


    .tagline {
      font-size: 1.02rem;
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 auto 24px auto;
      font-weight: 500;
      line-height: 1.55;
    }


    /* Primary Quick Action Buttons */
    .hero-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }


    @media (min-width: 520px) {
      .hero-actions {
        grid-template-columns: 1fr 1fr;
      }
    }


    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 22px;
      border-radius: 14px;
      font-size: 0.96rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }


    .btn-wa {
      background-color: var(--whatsapp);
      color: #FFFFFF;
      box-shadow: 0 4px 16px rgba(37, 211, 102, 0.32);
      border: 1px solid rgba(0,0,0,0.04);
    }


    .btn-wa:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.45);
    }


    .btn-ig {
      background: #FFFFFF;
      color: #0F172A;
      border: 1.5px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }


    .btn-ig:hover {
      border-color: #E1306C;
      color: #E1306C;
      background: #FFF5F7;
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 22px rgba(225, 48, 108, 0.18);
    }


    /* Metric Counters */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }


    .metric-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 10px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: tran      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
    }


    .workflow-step p {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }


    /* Portfolio Highlights */
    .portfolio-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 28px;
    }


    @media (min-width: 580px) {
      .portfolio-grid {
        grid-template-columns: 1fr 1fr;
      }
    }


    .portfolio-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: all 0.28s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }


    .portfolio-card:hover {
      border-color: var(--secondary);
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }


    .portfolio-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--secondary);
      background: #F0FDFA;
      border: 1px solid #CCFBF1;
      padding: 3px 10px;
      border-radius: 50px;
      display: inline-block;
      width: fit-content;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }


    .portfolio-card h4 {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }


    .portfolio-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 12px;
    }


    .portfolio-meta {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }


    /* Interactive FAQ Accordion */
    .faq-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
    }


    details {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px 20px;
      transition: all 0.25s ease;
      cursor: pointer;
    }


    details[open] {
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
      background: #FAFAFF;
    }


    summary {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      list-style: none;
      display: flex;
      justify-content: space-between;
